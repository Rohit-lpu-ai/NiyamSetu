[pytest]
# Tests import the project as the `backend` package, so pytest must run from the
# repository root. rootdir-relative import mode keeps `backend.tests` a real
# package, which is what lets conftest fixtures and pdf_builder be shared.
testpaths = backend/tests
python_files = test_*.py
addopts = -q --strict-markers
# Registered because --strict-markers is on: an unregistered marker is an
# error, not a silently ignored typo.
markers =
    integration: needs a real PostgreSQL server, and skips itself when
        NIYAMSETU_TEST_DATABASE_URL is unset. Mocked API tests never carry
        this marker, so "was this verified against a database?" is answerable
        from the marker alone rather than by reading the test body.
filterwarnings =
    error::DeprecationWarning:backend.*
