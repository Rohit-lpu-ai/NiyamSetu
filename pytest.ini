[pytest]
# Tests import the project as the `backend` package, so pytest must run from the
# repository root. rootdir-relative import mode keeps `backend.tests` a real
# package, which is what lets conftest fixtures and pdf_builder be shared.
testpaths = backend/tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:backend.*
